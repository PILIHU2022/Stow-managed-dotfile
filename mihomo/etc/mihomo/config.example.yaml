# =============================================================================
# config.example.yaml —— config.yaml 的脱敏版本，用于提交到 git。
#
# 脱敏项（真实值只存在于本地 mihomo/etc/mihomo/config.yaml 与线上
# /etc/mihomo/config.yaml，两者都被 .gitignore 排除）：
#   1. proxy-providers.独角兽.url 的机场地址与 token
#   2. proxies 中 GCP 节点的 server / uuid / reality 公钥
#
# 部署：cp 本文件为 /etc/mihomo/config.yaml，再把占位符换回真实值。
#   建议 install -m 0600 -o root -g root，避免订阅 token 与节点凭据被普通用户读取。
# =============================================================================

# =============================================================================
# Mihomo 配置文件
# 资源: https://wiki.metacubex.one/config/
# 规则集: https://ruleset.skk.moe/ (Sukka)
# 分组结构: 借鉴 https://github.com/HenryChiao/MIHOMO_YAMLS 的分层与 filter 写法
#           （只取结构，不套用其整份模板，见 docs/mihomo-config-structure.md）
# 最后更新: 2026-11-01
# =============================================================================

# ================================ 端口配置 ====================================
mixed-port: 7890              # 混合代理端口（HTTP + SOCKS）
port: 20173                   # HTTP 代理端口
socks-port: 20172             # SOCKS5 代理端口

# ================================ 通用设置 ====================================
allow-lan: true               # 允许局域网连接
mode: rule                    # 运行模式: rule / global / direct
log-level: warning            # 排障时临时调成 info；常驻 info 会让 journal 日志暴涨
ipv6: true                    # 启用 IPv6（全局开关）

external-controller: 127.0.0.1:9090   # 外部控制器（Web UI）监听地址
tcp-concurrent: true                 # 并发 TCP 连接，加速多资源页面加载
unified-delay: true                  # 用「握手 + 首字节」统一口径测延迟，避免 url-test 误判

# ---- 状态持久化 ----
# store-selected: 面板里手选的节点/分组写进 cache.db，重启后不回到默认值。
# store-fake-ip: fake-ip 映射落盘，重启后同一域名仍拿到同一个假 IP，
#                避免已建立的连接在重启后失配。
profile:
  store-selected: true
  store-fake-ip: true

# ================================ TUN 虚拟网卡 ================================
# TUN 模式劫持所有系统流量，实现全局代理
tun:
  enable: true
  device: Mihomo              # 虚拟网卡名称（macOS 建议删除此项）
  stack: gvisor               # 网络栈: gvisor / mixed / system
  mtu: 1400                   # 最大传输单元（部分环境需调小防断流）
  auto-route: true            # 自动配置路由表
  auto-detect-interface: true # 自动检测物理网卡
  dns-hijack:                 # DNS 劫持：拦截所有 DNS 请求防止泄露
    - any:53                  # 劫持 UDP :53 流量
    - tcp://any:53            # 劫持 TCP :53 流量

# ================================ 域名嗅探 ====================================
# 浏览器自带 DoH、连接复用与 Alt-Svc 会让一部分连接以「裸 IP」到达 mihomo，
# 此时域名规则全部失效、只能落到 MATCH → Proxy。Apple Music 正是受害者：
# 网页 music.apple.com 解析到金山云 CN CDN（本就走直连），而 API 主机
# amp-api.music.apple.com 解析到 Fastly 的 151.101.79.6——一旦以裸 IP 到达，
# 就被 MATCH 送去韩国出口，Apple 判定页面与接口区域不一致，于是报错并把
# 页面导到 /us/。启用嗅探后，mihomo 会从 TLS ClientHello / QUIC Initial /
# HTTP Host 还原出域名，使裸 IP 连接同样命中域名规则。
sniffer:
  enable: true
  parse-pure-ip: true          # 关键项：对纯 IP 连接也尝试嗅探
  force-dns-mapping: true      # fake-ip 模式下强制用 DNS 映射还原域名
  override-destination: false  # 保留原始目标 IP，只用嗅探结果匹配规则
  sniff:
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
    HTTP:
      ports: [80, 8080-8880]

# ================================ DNS 配置 ====================================
# 策略: fake-ip 模式 + respect-rules
# 国内域名 → 国内 DoH（腾讯/阿里）
# 国外域名 → 国外 DoH（Cloudflare/Google）
# 未分类域名 → 国外 DoH（兜底）
dns:
  enable: true
  listen: 0.0.0.0:53          # 监听所有接口（配合 TUN dns-hijack）
  prefer-h3: false            # 不用 HTTP/3 发 DoH：QUIC 被路由到代理时会解析失败
  ipv6: true                  # 启用 IPv6 域名解析
  enhanced-mode: fake-ip      # DNS 模式: fake-ip（返回虚拟 IP，由 mihomo 代为发起连接）
  respect-rules: true         # 遵循规则路由（域名命中 DIRECT 则用 direct-nameserver 解析）
  fake-ip-range: 198.18.0.1/16  # fake-ip 地址段（不应与真实 IP 冲突）
  use-hosts: false            # 不使用 /etc/hosts（防止 DNS 泄露）
  use-system-hosts: false     # 不使用系统 hosts（防止 DNS 泄露）

  # ---- fake-ip 豁免列表 ----
  # 这些域名返回真实 IP（不经过 fake-ip），用于本地网络/连通性检测
  fake-ip-filter:
    - '*.lan'
    - '*.local'
    - '*.localhost'
    - '*.srv.nintendo.net'
    - '*.stun.playstation.net'
    - '*.msftconnecttest.com'
    - '*.msftncsi.com'
    - localhost.ptlogin2.qq.com
    # ---- Tailscale ----
    # tailscaled 给自己的 socket 打 fwmark 0x80000，并安装
    #   ip rule pref 5210 fwmark 0x80000/0xff0000 lookup main
    # 让这些连接绕开任何 TUN、直接从物理网卡出去（避免自己套自己）。因此
    # fake-ip 对它有害：DNS 若返回 198.18.0.9，SYN 却按上面的规则从物理网卡
    # 发往 198.18.0.9，会永久停在 SYN-SENT，`tailscale up` 于是卡在
    # controlplane.tailscale.com/machine/register，反复报
    # "connection attempts aborted by context: context deadline exceeded"。
    # 让这些域名返回真实 IP（192.200.0.x），tailscaled 的直连才成立；
    # DERP（derp*.tailscale.com）、log、login 同理，一并豁免。
    - '+.tailscale.com'
    - '+.tailscale.io'
    - '+.tailscale.net'
    - '+.ts.net'

  # ---- 用于解析 DNS 服务器地址的纯 IP DNS ----
  # 当 DoH/DNS 服务器本身需要域名解析时，使用这些 DNS（纯 UDP，不可用 DoH）
  default-nameserver:
    - 119.29.29.29            # 腾讯 DNSPod
    - 223.5.5.5               # 阿里云 DNS

  # ---- 兜底 DNS 服务器 ----
  # 未命中 nameserver-policy 的域名使用此 DNS 解析
  nameserver:
    - https://1.1.1.1/dns-query        # Cloudflare DoH
    - https://dns.google/dns-query      # Google DoH

  # ---- 直连流量专用 DNS ----
  # 当规则命中 DIRECT 时，使用此 DNS 解析（国内 CDN 获得正确 IP）
  direct-nameserver:
    - https://doh.pub/dns-query         # 腾讯 DNSPod DoH
    - https://dns.alidns.com/dns-query  # 阿里云 DoH

  # ---- 代理节点地址解析 ----
  # 用于解析订阅 URL 与节点 server 域名。原先用明文 UDP（119.29.29.29 /
  # 223.5.5.5）：机场节点域名在明文 DNS 下会被污染或直接丢弃，日志中出现大量
  # 「dns resolve failed: couldn't find ip」，节点拨不通、播放中断。
  # 改用 DoH；DoH 服务器自身的地址由 default-nameserver 引导解析，无循环依赖。
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # ---- 按策略分流 DNS ----
  nameserver-policy:
    "geosite:cn,private":              # 国内域名 + 私有域名
      - https://doh.pub/dns-query
      - https://dns.alidns.com/dns-query
    "geosite:geolocation-!cn":         # 非中国大陆域名
      - https://1.1.1.1/dns-query
      - https://dns.google/dns-query

# ================================ Geo 数据 ====================================
geodata-mode: true            # 启用 GeoData 模式（使用 .dat 格式）
geox-url:                     # Geo 数据自动更新地址
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country-lite.mmdb"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"

# ================================ 内置代理 ====================================
proxies:
  - name: "直连"
    type: direct
    udp: true

  # ---- GCP 免费节点 ----
  # 来源: /etc/mihomo/profiles/GCP-Free.yaml —— 那是一份**完整的** mihomo 配置
  # （自带 mixed-port / proxy-groups / rules），不能直接当 proxy-provider 用，
  # 所以只把其中的 proxies 段原样搬进来，节点名保持不变便于对照。
  # 真实凭据只写在本地 config.yaml（已 .gitignore），本示例用占位符。
  - name: "GCP-Reality-443"
    type: vless
    server: YOUR_GCP_SERVER_IP
    port: 443
    uuid: YOUR_VLESS_UUID
    network: tcp
    udp: true
    tls: true
    flow: xtls-rprx-vision
    servername: www.cloudflare.com
    client-fingerprint: chrome
    reality-opts:
      public-key: YOUR_REALITY_PUBLIC_KEY
      short-id: ""

# ================================ 订阅代理集 ==================================
proxy-providers:
  # ---- 提供商: 独角兽 ----
  独角兽:
    type: http
    url: 'https://YOUR_AIRPORT_HOST/api/v1/client/subscribe?token=YOUR_SUBSCRIPTION_TOKEN'
    interval: 3600            # 更新间隔（秒）
    path: ./profile/Dujiaoshou.yaml
    exclude-filter: '剩余|重置|过期|已用|可用|流量|到期|天数|总额|官网|客服|网站|网址|获取|订阅|机场|下次|版本|官址|备用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|家宽|防失联|(?i)use|(?i)total|(?i)expire|(?i)email|(?i)panel|(?i)channel|(?i)author'
    health-check:
      enable: true
      interval: 300
      lazy: true              # 未使用时不对该集合作健康检查
      url: https://www.gstatic.com/generate_204
    override:
      additional-prefix: "[独角兽] "   # 节点名前缀（便于区分提供商）
      skip-cert-verify: true          # 跳过证书验证（机场节点常用）
      client-fingerprint: chrome      # TLS 指纹伪装 Chrome，避免 CDN 限速

# ================================ 分组模板（YAML 锚点） ========================
# 借鉴上游的分层思路：把重复的 type/url/interval 收敛成锚点，改一处全组生效。
BaseUT: &BaseUT {type: url-test, url: 'https://www.gstatic.com/generate_204', interval: 300, tolerance: 50, lazy: true, hidden: true}
BaseFB: &BaseFB {type: fallback, url: 'https://www.gstatic.com/generate_204', interval: 300, lazy: true}

# 服务组通用选项：默认跟随 Proxy，也可以一键改指到某个地区
SelectPY: &SelectPY {type: select, proxies: [Proxy, 故障转移, 手动选择, 香港策略, 台湾策略, 日本策略, 新加坡策略, 美国策略, 其他策略, 直连]}

# 节点名过滤：正向命中地区、反向排除机场广告/到期节点。
# 语法是 Perl 兼容正则（mihomo 支持 lookahead/lookbehind），不是 Go regexp。
FilterAL: &FilterAL '^(?=.*(?i)(.))(?!.*(剩余|重置|过期|已用|可用|流量|到期|天数|总额|官网|客服|网站|网址|获取|订阅|机场|下次|版本|官址|备用|联系|邮箱|工单|贩卖|通知|倒卖|防止|国内|地址|频道|无法|说明|使用|提示|特别|访问|支持|教程|关注|更新|作者|加入|家宽|防失联|直连|use|total|expire|email|panel|channel|author)).*$'
FilterHK: &FilterHK '^(?=.*(?i)(香港|🇭🇰|HK|Hong))(?!.*(剩余|到期)).*$'
FilterTW: &FilterTW '^(?=.*(?i)(台湾|台灣|TW|Taiwan|TPE))(?!.*(剩余|到期)).*$'
FilterJP: &FilterJP '^(?=.*(?i)(日本|🇯🇵|JP|Japan|NRT|HND|KIX))(?!.*(剩余|到期)).*$'
FilterSG: &FilterSG '^(?=.*(?i)(新加坡|狮城|獅城|🇸🇬|SG|Sing))(?!.*(剩余|到期)).*$'
FilterUS: &FilterUS '^(?=.*(?i)(美国|美國|🇺🇸|US|USA|LAX|SJC|JFK|SFO))(?!.*(剩余|到期)).*$'
# 「其他地区」= 不属于上面任何一组的节点（韩国/欧洲/南美/中东…以及 GCP 节点）
FilterOT: &FilterOT '^(?!.*(香港|🇭🇰|HK|Hong|台湾|台灣|TW|Taiwan|TPE|日本|🇯🇵|JP|Japan|NRT|HND|KIX|新加坡|狮城|獅城|🇸🇬|SG|Sing|美国|美國|🇺🇸|US|USA|LAX|SJC|JFK|SFO|直连|剩余|到期)).*$'

# ================================ 代理组 ======================================
# 分层：Proxy(总入口) → 地区策略(手动选) → 地区自动(url-test, hidden) → 节点
# 所有叶子组 hidden，面板里只剩需要点的条目；include-all 让新机场零改动接入。
proxy-groups:
  # ---------- 总入口 ----------
  # MATCH 兜底目标。名字沿用 Proxy，是为了不让 cache.db 里的历史选择失效。
  - {name: "Proxy", type: select, proxies: [手动选择, 自动选择, 故障转移, 香港策略, 台湾策略, 日本策略, 新加坡策略, 美国策略, 其他策略, GCP, 直连]}

  # ---------- 自动 / 手动 ----------
  - {name: "手动选择", type: select, include-all: true, filter: *FilterAL, exclude-filter: 'GCP-Reality'}
  - {name: "自动选择", <<: *BaseUT, hidden: false, include-all: true, filter: *FilterAL, exclude-filter: 'GCP-Reality'}

  # 故障转移：按「地区自动」顺序逐个试，第一个活着的不一定是延迟最低的，
  # 但整组节点全挂时会自动往后切，避免单点故障直接断网。
  - {name: "故障转移", <<: *BaseFB, proxies: [香港自动, 日本自动, 新加坡自动, 美国自动, 其他策略, 直连]}

  # ---------- 服务专用组 ----------
  # 默认都跟 Proxy；需要让某个服务单独走地区时，在面板里改这一个组即可。
  - {name: "AI", <<: *SelectPY}
  - {name: "流媒体", <<: *SelectPY}
  - {name: "电报", <<: *SelectPY}
  - {name: "微软", <<: *SelectPY}
  - {name: "谷歌", <<: *SelectPY}
  - {name: "GitHub", <<: *SelectPY}

  # Apple 依据出口 IP 归属地决定 storefront：机房出口会被判成 /us/，CN 账号
  # 随即报错。所以直连必须排在首位——无论 cache.db 是否丢失、配置是否重载，
  # Apple 都走本机 CN 出口。
  - {name: "Apple_Service", type: select, proxies: [直连, Proxy, 香港策略, 台湾策略, 日本策略, 新加坡策略, 美国策略]}

  # ---------- 地区策略（可见，默认选该地区的自动组） ----------
  - {name: "香港策略", type: select, include-all: true, filter: *FilterHK, proxies: [香港自动]}
  - {name: "台湾策略", type: select, include-all: true, filter: *FilterTW, proxies: [台湾自动]}
  - {name: "日本策略", type: select, include-all: true, filter: *FilterJP, proxies: [日本自动]}
  - {name: "新加坡策略", type: select, include-all: true, filter: *FilterSG, proxies: [新加坡自动]}
  - {name: "美国策略", type: select, include-all: true, filter: *FilterUS, proxies: [美国自动]}
  - {name: "其他策略", type: select, include-all: true, filter: *FilterOT, exclude-filter: 'GCP-Reality'}

  # ---------- 免费节点（独立入口） ----------
  # 延迟极低（实测 0.08s），但会间歇性 "REALITY authentication failed"，
  # 所以不参与自动优选，只在这里手动切；Proxy 里也留了一个入口。
  - {name: "GCP", type: select, proxies: [GCP-Reality-443]}

  # ---------- 地区自动（hidden，实现细节） ----------
  - {name: "香港自动", <<: *BaseUT, include-all: true, filter: *FilterHK}
  - {name: "台湾自动", <<: *BaseUT, include-all: true, filter: *FilterTW}
  - {name: "日本自动", <<: *BaseUT, include-all: true, filter: *FilterJP}
  - {name: "新加坡自动", <<: *BaseUT, include-all: true, filter: *FilterSG}
  - {name: "美国自动", <<: *BaseUT, include-all: true, filter: *FilterUS}

# ================================ 规则集锚点 ==================================
# YAML 锚点，用于 rule-providers 复用配置
RuleSet_classical: &RuleSet_classical {type: http, behavior: classical, interval: 43200, format: text, proxy: Proxy}
RuleSet_domain: &RuleSet_domain {type: http, behavior: domain, interval: 43200, format: text, proxy: Proxy}
RuleSet_ipcidr: &RuleSet_ipcidr {type: http, behavior: ipcidr, interval: 43200, format: text, proxy: Proxy}

# ================================ 规则提供者 ==================================
# 远程规则集，来源: https://ruleset.skk.moe/ (Sukka 规则集)
rule-providers:
  # ---- 广告 / 恶意 / 拦截 ----
  reject_non_ip_no_drop:
    <<: *RuleSet_classical
    url: 'https://ruleset.skk.moe/Clash/non_ip/reject-no-drop.txt'
    path: './rule_set/sukkaw_ruleset/reject_non_ip_no_drop.txt'
  reject_non_ip_drop:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/reject-drop.txt
    path: ./rule_set/sukkaw_ruleset/reject_non_ip_drop.txt
  reject_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_non_ip.txt
  reject_domainset:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_domainset.txt
  reject_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/reject.txt
    path: ./rule_set/sukkaw_ruleset/reject_ip.txt

  # ---- CDN 加速 ----
  cdn_domainset:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/cdn.txt
    path: ./rule_set/sukkaw_ruleset/cdn_domainset.txt
  cdn_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/cdn.txt
    path: ./rule_set/sukkaw_ruleset/cdn_non_ip.txt

  # ---- 流媒体 ----
  stream_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/stream.txt
    path: ./rule_set/sukkaw_ruleset/stream_non_ip.txt
  stream_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/stream.txt
    path: ./rule_set/sukkaw_ruleset/stream_ip.txt

  # ---- AI 服务 ----
  ai_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/ai.txt
    path: ./rule_set/sukkaw_ruleset/ai_non_ip.txt

  # ---- Telegram ----
  telegram_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/telegram.txt
    path: ./rule_set/sukkaw_ruleset/telegram_non_ip.txt
  telegram_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/ip/telegram.txt
    path: ./rule_set/sukkaw_ruleset/telegram_ip.txt

  # ---- Apple ----
  apple_cdn:
    <<: *RuleSet_domain
    url: https://ruleset.skk.moe/Clash/domainset/apple_cdn.txt
    path: ./rule_set/sukkaw_ruleset/apple_cdn.txt
  apple_services:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/apple_services.txt
    path: ./rule_set/sukkaw_ruleset/apple_services.txt
  apple_cn_non_ip:
    <<: *RuleSet_classical
    url: https://ruleset.skk.moe/Clash/non_ip/apple_cn.txt
