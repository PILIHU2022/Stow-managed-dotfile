# Visit https://man.archlinux.org/man/fuzzel.ini.5.en for Arch Linux users to
# know more.
# Thanks to https://codeberg.org/dnkl/fuzzel
[main]
# fields 在 fuzzel 1.15 已不能写在配置里（--check-config 会报错），改用命令行 -F/--fields
# fields='filename', 'name', 'keyword'
font=Cascadia Mono SemiBold:size=15
width=50
tabs=10
show-actions=yes
placeholder='None'
use-bold=yes

# Color
include='~/.config/fuzzel/color.ini'
