<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!--
 网页图标字体的本地兜底（主要针对 Firefox）

 现象：有些网页的图标（尤其是「加载 / 转圈」spinner）显示成“方框里带十六进制数字”
 的豆腐块（例如 F1 10），而不是图标本身。那个方框是 Firefox 自己的 missing-glyph
 占位符，说明该字符没有任何可用字体。

 根因（Gecko 159 源码 + 无头 Firefox 实测）：
   * 这类图标是 icon webfont 的 Unicode 私用区（PUA，U+E000–U+F8FF）码位。
   * Firefox 对 PUA / Unicode 未分配码位**有意不做系统字体回退**：
     gfxTextRun.cpp 的 gfxFontGroup::FindFontForChar 遇到这类字符会命中
     SkipFontFallbackForChar 直接返回，不再搜索 pref font / system font；
     gfxPlatformFontList::InitializeCodepointsWithNoFonts 启动时就把
     U+E000–F8FF 和补充私用区写进“无字体码位”集合。官方注释：
     “We only support such codepoints when used with an explicitly-specified font”。
   * 所以给 sans-serif / serif / monospace 链加 Symbols Nerd Font、Font Awesome
     等**没有用**；fontconfig 的 <test name="charset"> 规则对 Firefox 也**不生效**
     （Linux 没有实现基于 fontconfig 的逐字符回退）。
   * 唯一有效的 fontconfig 手段是**按 CSS 里请求的 font-family 名做替换**，把该族
     解析到本机码位一致的图标字体上。

 生效条件与限制：
   * 只在页面 CSS 请求了这些家族名、且该名字没有被页面自己的 @font-face 定义时生效。
   * 如果页面用 @font-face 定义了同名 webfont 而字体文件加载失败（CDN 被墙 / 404 /
     CORS / 拦截插件），Firefox 会保留这个“空的同名用户字体”，既不会回落到同名系统
     字体、也不走 fontconfig 的 family 替换 —— 这种情况 fontconfig 修不了，需要
     Firefox 侧 userContent.css 强制字体栈或 Font Control 之类扩展。
   * 页面 @font-face 正常加载时网页字体优先，本文件不影响它。

 已实测（无头 Firefox + 截图对照）：
   * "Font Awesome 5 Free" / "Font Awesome 6 Free" / "Font Awesome 4.7" 等
     → 本机 Font Awesome 7（FA5/6/7 常用图标码位一致，spinner/circle-notch/
       check/gear 均正确；Solid 面才含图标字形，故映射到 "Font Awesome 7 Free Solid"）
   * "Font Awesome 5 Brands" / "Font Awesome 6 Brands" → Font Awesome 7 Brands
   * "FontAwesome"（Font Awesome 4）→ 直接命中 /usr/share/ariang/fonts 里的官方 FA4
   * "Glyphicons Halflings" → /opt/ventoy 里的官方 Bootstrap Glyphicons 字体
   * "Ionicons" → /opt/ventoy 里的官方 Ionicons 2 字体

 依赖说明（都是 Arch 软件包自带，缺了就静默跳过，不会影响其它字体）：
   * ariang       → /usr/share/ariang/fonts/fontawesome-webfont.ttf（Font Awesome 4）
   * ventoy-bin   → /opt/ventoy/WebUI/static/fonts（Font Awesome 4 / Glyphicons / Ionicons）
   * font-awesome(system) → /usr/share/fonts/OTF/Font Awesome 7*.otf
 这些字体文件不复制进本仓库，只把应用自带字体所在目录加进 fontconfig 搜索路径。

 已知不支持（本机没有同码位字体，映射过去会变成“错误图标”，比豆腐块更糟）：
 Material Icons / Material Symbols、Element UI、Ant Design、Bootstrap Icons、
 Feather、Octicons 等；这些页面在图标字体缺失时仍会是 hex box。

 放在 conf.d/ 而不是 fonts.conf：这些是“按字体族名做替换”的独立规则，与
 fonts.conf 里的通用族（sans-serif/serif/monospace）链没有先后依赖；放在这里
 可以保证无论启用哪个 fonts_with_*.conf 变体都继续有效。
-->

<fontconfig>
  <!-- 本机已装应用自带的图标字体（码位与官方 webfont 一致，可直接当兜底） -->
  <dir>/usr/share/ariang/fonts</dir>
  <dir>/opt/ventoy/WebUI/static/fonts</dir>

  <!-- Font Awesome 5/6/7（含 Pro/Sharp/Duotone 等变体名）：用本机 Font Awesome 7 兜底。
       注意：后出现的规则会 prepend 到更前面，所以通用的 "Font Awesome" 规则写在
       "Brands" 规则之前，让 Brands 页面优先拿到品牌字体。 -->
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Font Awesome</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Font Awesome 7 Free Solid</string>
    </edit>
  </match>
  <match target="pattern">
    <test name="family" compare="contains">
      <string>Font Awesome</string>
    </test>
    <test name="family" compare="contains">
      <string>Brands</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Font Awesome 7 Brands</string>
    </edit>
  </match>
</fontconfig>
