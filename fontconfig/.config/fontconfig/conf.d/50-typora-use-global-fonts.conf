<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM 'urn:fontconfig:fonts.dtd'>
<!--
 让 Typora 遵循 fontconfig 的全局设置（即 ../fonts.conf 里的设置）

 Typora 是 Electron 应用，它在自己的 CSS 里写死了字体栈
 （style/base.css、style/window.css、style/themes/*.css 等），
 所以 fonts.conf 里定义的 sans-serif / serif / monospace 根本轮不到生效：
 例如文档要 "Helvetica"、代码要 "Lucida Console"、界面要 "Segoe UI"，
 fontconfig 就会直接给对应的 Windows 字体，而不是全局配置的字体。

 下面的规则把 Typora 请求的每个字体族改写成对应的通用族，
 再由 fonts.conf 里的通用族规则展开成全局字体，这样只维护全局设置即可。
 规则都用 prgname="Typora" 限定（fontconfig 取 /proc/self/exe 的文件名，
 即 /usr/share/typora/Typora），因此不影响系统上其它程序。

 这个文件放在 conf.d/ 而不是写进 fonts.conf 是有意的：
 fontconfig 先加载 ~/.config/fontconfig/conf.d/*.conf，再加载
 ~/.config/fontconfig/fonts.conf；而一个在通用族规则执行之后才插入的族
 不会再被那些规则展开。所以请保持它在 conf.d/ 里（若合并进 fonts.conf，
 必须放在 "Default sans-serif/serif/monospace fonts" 三段之前）。
 这样无论启用哪个 fonts_with_*.conf 变体，本文件都继续有效。

 说明与限制：
 * 字体族名大小写不敏感，故 CSS 里的 "arial"、"helvetica" 由 "Arial"、
   "Helvetica" 覆盖即可。
 * Chromium（Typora）解析字体时，每个 CSS 字体族只取替换后的第一个字体，再自己
   判断它是否覆盖该字符；不覆盖就试下一个 CSS 族，全都不行才走通用回退（落到
   sans 链）。因此 fonts.conf 里 monospace 链的第 2 个族（等宽中文）对 Chromium
   是不可见的，必须让 Typora 等宽字体栈中的某个 CSS 族本身解析成等宽中文；
   见下面「代码块 / 等宽：中文」一组，以及其中对位置关系的说明。
 * 唯一改不动的部分：github/pixyll/newsprint 主题用 @font-face 自带了
   网页字体（github 的 "Open Sans" 等），CSS 里 @font-face 优先于
   fontconfig，所以这些主题正文的拉丁字母仍是主题自带字体。
   中文、符号、emoji、行内代码、界面则会按全局设置走。
   若正文拉丁字母也要跟随全局设置，请用 Typora 自己的字体偏好设置，
   或改主题 CSS —— 这不是 fontconfig 能覆盖的。
 * 因此 @font-face 的族（"Open Sans"、"Merriweather"、"Lato"、
   "PT Serif"、Raleway）与 FontAwesome/Ionicons 等图标字体不在下表内；
   "Open Sans" 是例外，列在 sans-serif 组里：只有主题网页字体加载失败时
   Typora 才会问到 fontconfig，此时按全局设置走。
-->
<fontconfig>
 <!-- ===== 正文 / 界面 → 全局 sans-serif ===== -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Open Sans</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Clear Sans</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Helvetica Neue</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Helvetica</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Arial</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Segoe UI</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Segoe UI Emoji</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Segoe UI Symbol</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>SF Pro</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>.SFNSDisplay-Regular</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>-apple-system</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Lucida Grande</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Verdana</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Corbel</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>gotham</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Source Sans Pro</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Microsoft YaHei</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Hiragino Sans GB</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>WenQuanYi Micro Hei</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>system</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>
 <!-- emoji：Chromium 按 fontconfig 2.18 的通用族 "emoji" 取字体（系统
      49-sansserif.conf 把它指向 Noto Color Emoji），这里让它改走全局
      sans-serif，于是 emoji 由全局列表里的 Twemoji 提供。 -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>emoji</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>sans-serif</string></edit>
 </match>

 <!-- ===== 衬线主题（newsprint/whitey/pixyll）→ 全局 serif ===== -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Georgia</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Times</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Times New Roman</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Palatino</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Vollkorn</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>STSong</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>serif</string></edit>
 </match>

 <!-- ===== 代码块 / 等宽：拉丁字母 → 全局 monospace ===== -->
 <!-- monospace 链的首个族就是全局等宽拉丁字体（fonts.conf 里是 Iosevka Spark Mono） -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Lucida Console</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Consolas</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Menlo</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Monaco</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Ubuntu Mono</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>LetterGothicStd</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>ui-monospace</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>monospace</string></edit>
 </match>

 <!-- ===== 代码块 / 等宽：中文 → 全局等宽中文（LXGW WenKai Mono Screen）===== -->
 <!-- 这四个族在 Typora 自带主题的等宽字体栈里都排在别的等宽族后面：
        base/github: "Lucida Console", Consolas, "Courier", monospace
        night:       Monaco, Consolas, "Andale Mono", "DejaVu Sans Mono", monospace
        pixyll:      Menlo, Monaco, "Courier New", monospace
        newsprint:   Menlo, 'Ubuntu Mono', Consolas, 'Courier New', …
      所以等宽文本里的拉丁字母早就被前面的族（= 全局等宽拉丁字体）命中，只有前面那些族
      渲染不了的中文才会走到这里 —— 直接指向全局等宽中文，代码块中文才不会退回比例版楷体。
      注意：whitey 主题的代码栈是 "Consolas","Menlo","Monaco",monospace,serif，不含这四个族，
      它的代码块中文仍由 sans 链的比例版提供；pixyll/whitey 的源码模式栈以 Courier 打头，
      那里的拉丁字母会跟着变成等宽中文，改用别的主题可回避。 -->
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Courier</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>LXGW WenKai Mono Screen</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Courier New</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>LXGW WenKai Mono Screen</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>Andale Mono</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>LXGW WenKai Mono Screen</string></edit>
 </match>
 <match target="pattern">
  <test name="prgname" compare="eq"><string>Typora</string></test><test name="family" compare="eq"><string>DejaVu Sans Mono</string></test>
  <edit binding="strong" mode="prepend_first" name="family"><string>LXGW WenKai Mono Screen</string></edit>
 </match>
</fontconfig>
